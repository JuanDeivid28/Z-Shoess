<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Registro de Usuario</title>
  <style>
    body{
      margin:0; font-family:Arial, Helvetica, sans-serif;
      background:linear-gradient(135deg,#1e3c72,#2a5298);
      color:#fff; display:flex; align-items:center; justify-content:center; height:100vh;
    }
    .container{
      background:rgba(255,255,255,0.1);
      padding:24px; border-radius:12px; width:100%; max-width:400px;
      box-shadow:0 8px 24px rgba(0,0,0,0.4);
    }
    h1{margin:0 0 20px; text-align:center; font-size:24px}
    .form-group{margin-bottom:15px}
    label{display:block; margin-bottom:6px; font-size:14px}
    input{
      width:100%; padding:10px; border:none; border-radius:8px;
      outline:none; font-size:14px;
    }
    input[type="submit"]{
      background:#06b6d4; color:#021024; font-weight:bold; cursor:pointer;
      transition:background .2s;
    }
    input[type="submit"]:hover{background:#0891b2}
    .message{margin-top:15px; font-size:14px; text-align:center; display:none}
    .success{color:#4ade80}
    .error{color:#f87171}
  </style>
</head>
<body>
  <div class="container">
    <h1>Registro</h1>
    <form id="registerForm">
      <div class="form-group">
        <label for="username">Usuario</label>
        <input type="text" id="username" name="username" required>
      </div>
      <div class="form-group">
        <label for="email">Correo electrónico</label>
        <input type="email" id="email" name="email" required>
      </div>
      <div class="form-group">
        <label for="password">Contraseña</label>
        <input type="password" id="password" name="password" required minlength="6">
      </div>
      <input type="submit" value="Registrarse">
    </form>
    <div id="message" class="message"></div>
  </div>

  <script>
    const form = document.getElementById('registerForm');
    const messageEl = document.getElementById('message');

    form.addEventListener('submit', function(e){
      e.preventDefault();
      const username = document.getElementById('username').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value.trim();

      if(username && email && password.length >= 6){
        messageEl.textContent = `¡Registro exitoso! Bienvenido, ${username}`;
        messageEl.className = 'message success';
        messageEl.style.display = 'block';
        form.reset();
      } else {
        messageEl.textContent = 'Por favor completa todos los campos correctamente.';
        messageEl.className = 'message error';
        messageEl.style.display = 'block';
      }
    });
  </script>
</body>
</html>
